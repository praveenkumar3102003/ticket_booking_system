<div class="auth-wrapper">
  <div class="auth-left">
    <div class="brand-block">
      <div class="brand-icon">🎬</div>
      <h1>MovieBook</h1>
      <p>Join thousands of movie lovers booking their perfect seats</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Start your movie journey today</p>

      <div class="success-msg" *ngIf="successMessage">✅ {{ successMessage }}</div>
      <div class="error-msg" *ngIf="errorMessage">❌ {{ errorMessage }}</div>

      <form (ngSubmit)="signup()" #signupForm="ngForm">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <span class="icon">👤</span>
            <input type="text" [(ngModel)]="name" name="name" required placeholder="Enter your full name" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="icon">✉️</span>
            <input type="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input type="password" [(ngModel)]="password" name="password" required minlength="6" placeholder="Minimum 6 characters" />
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Re-enter password" />
          </div>
        </div>

        <button type="submit" class="btn-auth" [disabled]="signupForm.invalid || loading">
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <p class="switch-link">Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
